name: "Elaborate package check"
description: "Thouroughly check an R package on different topics"
inputs:
  path:
    description: >
      Which path to check. This path is relative to the root of the repository.
    default: "."
  extra_repositories:
    description: >
      Additional repositories to use. A space or comma separated list of URLs.
      For example: "https://inbo.r-universe.dev https://cranhaven.r-universe.dev"
    default: "https://cranhaven.r-universe.dev https://inbo.r-universe.dev"

runs:

  using: "composite"
  steps:

    - name: "Check out code"
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        fetch-depth: 0

    - name: "get main branch"
      run: |
        cd $GITHUB_WORKSPACE
        CURRENT_COMMIT="$(git rev-parse HEAD)"
        if git ls-remote --exit-code --heads origin main >/dev/null 2>&1; then
          git fetch origin main:main --force
        elif git ls-remote --exit-code --heads origin master >/dev/null 2>&1; then
          git fetch origin master:master --force
        else
          echo "Neither main nor master branch found on origin." >&2
          exit 1
        fi
        git checkout --force "$CURRENT_COMMIT"
      shell: bash

    - name: "Set up R"
      uses: r-lib/actions/setup-r@ff9d3a3fd8acec17e91f1d0a1876d95ad60cb519
      with:
        r-version: release
        extra-repositories: ${{ inputs.extra_repositories }}


    - name: "Set up Pandoc"
      uses: r-lib/actions/setup-pandoc@f50f115c574d8cb2ddc24934af6bed478382b0e7

    - name: "Set up R dependencies"
      uses: r-lib/actions/setup-r-dependencies@2e3959d284a9ed60162f28a0f9891d1150f47f72
      with:
        extra-packages:
          any::citeme
          inbo/checklist@0.5.4
          any::covr
          any::curl
          any::cyclocomp
          any::pkgdown
          any::renv

    - name: "Check R package"
      env:
        _R_CHECK_SYSTEM_CLOCK_: false
        R_REMOTES_NO_ERRORS_FROM_WARNINGS: true

      run: |
        setwd("${{ inputs.path }}")
        descr_stats <- gert::git_stat_files("DESCRIPTION", repo = ".")
        desc_diff <- gert::git_diff(descr_stats$head, repo = ".")
        cat(desc_diff$patch[desc_diff$old == "DESCRIPTION"])
        pak::local_install_dev_deps()
        pak::local_install(dependencies = TRUE, upgrade = TRUE, ask = FALSE)
        citeme::get_default_org_list()
        checklist:::restore_roxygen2()
        checklist::install_pak()
        checklist::check_package()
        covr::codecov(quiet = FALSE, commit="'$GITHUB_SHA'")
        pkgdown::build_site(preview = FALSE, quiet = TRUE)
      shell: Rscript {0}
